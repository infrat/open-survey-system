; Standalone rover configuration (the monorepo root platformio.ini is the
; primary entry point - keep the two in sync).
;
; One image: BLE / Bluetooth SPP / WiFi TCP is chosen at runtime in the web UI.

[env:ttgo-lora32-v21]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson@6.21.6
    ESP32Async/ESPAsyncWebServer@3.7.10
    ESP32Async/AsyncTCP@3.4.10
    BLE
    BluetoothSerial
    LittleFS
    Preferences
    ESPmDNS
    ArduinoOTA

build_flags =
    -DCORE_DEBUG_LEVEL=3

monitor_filters =
    esp32_exception_decoder

; OTA upload (WiFi is only up during the setup window after boot)
upload_protocol = espota
upload_port = ossrtk.local
upload_flags =
    --auth=admin

; Serial upload: pio run -e ttgo-lora32-v21-usb -t upload
[env:ttgo-lora32-v21-usb]
extends = env:ttgo-lora32-v21
upload_protocol = esptool
upload_port = /dev/cu.usbserial-0001
upload_flags =
