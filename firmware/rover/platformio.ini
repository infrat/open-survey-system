; Standalone rover configuration (the monorepo root platformio.ini is the
; primary entry point — keep the two in sync).
;
; Environments:
;   ttgo-lora32-v21      — BLE Nordic UART Service (NimBLE), iOS + Android
;   ttgo-lora32-v21-spp  — Bluetooth Classic SPP (Bluedroid), Android only

[rover_base]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

; OTA upload configuration
upload_protocol = espota
upload_port = ossrtk.local
upload_flags = 
    --auth=admin

; Opcje monitora szeregowego
monitor_filters = 
    esp32_exception_decoder

; BLE transport (default) — NimBLE is lighter than Bluedroid (40KB vs 100KB)
[env:ttgo-lora32-v21]
extends = rover_base

lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.0

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DROVER_TRANSPORT=TRANSPORT_BLE

; Bluetooth Classic SPP transport — ANDROID ONLY (iOS has no SPP access)
[env:ttgo-lora32-v21-spp]
extends = rover_base

lib_deps = 
    BluetoothSerial

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DROVER_TRANSPORT=TRANSPORT_SPP
