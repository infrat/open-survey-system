; PlatformIO Monorepo Configuration
; gnss-rtk-toolset — aggregate configuration file for all subprojects
;
; Environments:
;   oss-transmitter  — RTCM correction transmitter (TTGO T-Beam, LoRa + Web UI)
;   oss-receiver     — RTCM correction receiver (TTGO LoRa32 v2.1)
;   oss-rover        — BLE/UART rover firmware (TTGO LoRa32 v2.1 / Wemos D1 Mini32)
;   oss-rover-spp    — same rover firmware over Bluetooth Classic SPP (Android only)
;
; PlatformIO documentation: https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
[platformio]
; Default environment used when -e is not specified
default_envs = oss-transmitter
; Monorepo: scan from project root; src_filter per env selects the right subtree
src_dir = .

; ---------------------------------------------------------------------------
; Common ESP32/Arduino settings — inherited by [env:*]
; ---------------------------------------------------------------------------
[common_esp32]
platform = espressif32
framework = arduino
monitor_speed = 115200

; ---------------------------------------------------------------------------
; OSS Transmitter
; Hardware: TTGO T-Beam (ESP32 + LoRa + GPS)
; Role:     fetches NTRIP corrections, broadcasts over LoRa; serves Web UI via LittleFS
; ---------------------------------------------------------------------------
[env:oss-transmitter]
extends = common_esp32
board = ttgo-t-beam
build_src_filter = -<*> +<firmware/transmitter/src/>
extra_scripts = pre:scripts/set_env_dirs.py

upload_port = /dev/cu.usbserial-54260057061
monitor_port = /dev/cu.usbserial-54260057061

board_build.filesystem = littlefs

lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
    sandeepmistry/LoRa@^0.8.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson@^6.21.3
    ; Framework-bundled libs not auto-detected when building from monorepo root
    LittleFS
    Wire
; OSS Receiver
; Hardware: TTGO LoRa32 v2.1 (ESP32 + LoRa + OLED)
; Role:     receives corrections over LoRa and forwards them to the GNSS receiver
; ---------------------------------------------------------------------------
[env:oss-receiver]
extends = common_esp32
board = ttgo-lora32-v21
build_src_filter = -<*> +<firmware/receiver/src/>
extra_scripts = pre:scripts/set_env_dirs.py

upload_port  = /dev/cu.usbserial-537D0034521
monitor_port = /dev/cu.usbserial-537D0034521

lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
    sandeepmistry/LoRa@^0.8.0
    ; Framework-bundled libs not auto-detected when building from monorepo root
    WiFi
    Wire

; ---------------------------------------------------------------------------
; OSS Rover — shared settings for both transport variants
; Hardware: Wemos D1 Mini32 / TTGO LoRa32 v2.1 (ESP32)
; Role:     Bluetooth ↔ UART bridge to the GNSS module (RTK rover)
; Upload:   OTA (espota) to ossrtk.local
; ---------------------------------------------------------------------------
[rover_base]
extends = common_esp32
board = wemos_d1_mini32
build_src_filter = -<*> +<firmware/rover/src/>
extra_scripts = pre:scripts/set_env_dirs.py

board_build.partitions = min_spiffs.csv

; OTA — flash over the network instead of USB
upload_protocol = espota
upload_port     = ossrtk.local
upload_flags    =
    --auth=admin

monitor_filters =
    esp32_exception_decoder

; ---------------------------------------------------------------------------
; OSS Rover — BLE Nordic UART Service (NimBLE). DEFAULT.
; Works with iOS and Android survey apps. Lower RAM/flash/power.
; ---------------------------------------------------------------------------
[env:oss-rover]
extends = rover_base

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DROVER_TRANSPORT=TRANSPORT_BLE

; ---------------------------------------------------------------------------
; OSS Rover — Bluetooth Classic SPP (Bluedroid).
; ANDROID ONLY: iOS does not expose SPP to apps without MFi certification.
; Higher throughput (no 185B MTU, no inter-chunk delay), higher power draw.
; NimBLE is intentionally absent here — the two BT hosts are exclusive.
; ---------------------------------------------------------------------------
[env:oss-rover-spp]
extends = rover_base

lib_deps =
    ; Framework-bundled lib not auto-detected when building from monorepo root
    BluetoothSerial

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DROVER_TRANSPORT=TRANSPORT_SPP
