; PlatformIO Monorepo Configuration
; gnss-rtk-toolset — zbiorczy plik konfiguracji dla wszystkich subprojektów
;
; Środowiska:
;   oss-transmitter  — nadajnik korekcji RTCM (TTGO T-Beam, LoRa + Web UI)
;   oss-receiver     — odbiornik korekcji RTCM (TTGO LoRa32 v2.1)
;   oss-rover        — firmware rovera BLE/UART (TTGO LoRa32 v2.1 / Wemos D1 Mini32)
;
; Dokumentacja PlatformIO: https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
[platformio]
; Domyślne środowisko uruchamiane bez podania -e
default_envs = oss-transmitter
; Monorepo: scan from project root; src_filter per env selects the right subtree
src_dir = .

; ---------------------------------------------------------------------------
; Wspólne ustawienia ESP32/Arduino — dziedziczone przez [env:*]
; ---------------------------------------------------------------------------
[common_esp32]
platform = espressif32
framework = arduino
monitor_speed = 115200

; ---------------------------------------------------------------------------
; OSS Transmitter
; Sprzęt: TTGO T-Beam (ESP32 + LoRa + GPS)
; Rola:   pobiera korekcje NTRIP, rozsyła przez LoRa; serwuje Web UI przez LittleFS
; ---------------------------------------------------------------------------
[env:oss-transmitter]
extends = common_esp32
board = ttgo-t-beam
build_src_filter = -<*> +<firmware/transmitter/src/>
extra_scripts = pre:scripts/set_env_dirs.py

upload_port = /dev/cu.usbserial-54260057061
monitor_port = /dev/cu.usbserial-54260057061

board_build.filesystem = littlefs

lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
    sandeepmistry/LoRa@^0.8.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson@^6.21.3
    ; Framework-bundled libs not auto-detected when building from monorepo root
    LittleFS
    Wire
; OSS Receiver
; Sprzęt: TTGO LoRa32 v2.1 (ESP32 + LoRa + OLED)
; Rola:   odbiera korekcje przez LoRa i przekazuje do odbiornika GNSS
; ---------------------------------------------------------------------------
[env:oss-receiver]
extends = common_esp32
board = ttgo-lora32-v21
build_src_filter = -<*> +<firmware/receiver/src/>
extra_scripts = pre:scripts/set_env_dirs.py

upload_port  = /dev/cu.usbserial-537D0034521
monitor_port = /dev/cu.usbserial-537D0034521

lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
    sandeepmistry/LoRa@^0.8.0
    ; Framework-bundled libs not auto-detected when building from monorepo root
    WiFi
    Wire

; ---------------------------------------------------------------------------
; OSS Rover
; Sprzęt: Wemos D1 Mini32 / TTGO LoRa32 v2.1 (ESP32)
; Rola:   mostek BLE ↔ UART do modułu GNSS (RTK rover)
; Upload: OTA (espota) na ossrtk.local
; ---------------------------------------------------------------------------
[env:oss-rover]
extends = common_esp32
board = wemos_d1_mini32
build_src_filter = -<*> +<firmware/rover/src/>
extra_scripts = pre:scripts/set_env_dirs.py

board_build.partitions = min_spiffs.csv

; OTA — wgraj przez sieć zamiast USB
upload_protocol = espota
upload_port     = ossrtk.local
upload_flags    =
    --auth=admin

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

monitor_filters =
    esp32_exception_decoder
