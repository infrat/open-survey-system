[env:ttgo-lora32-v21]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

; OTA upload configuration
upload_protocol = espota
upload_port = ossrtk.local
upload_flags = 
    --auth=admin

; NimBLE library for lighter BLE support (40KB vs 100KB for standard)
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.0

; Opcje kompilacji dla lepszej optymalizacji
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Opcje monitora szeregowego
monitor_filters = 
    esp32_exception_decoder
